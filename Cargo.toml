[package]
name = "arch-maint"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A recovery-oriented Arch Linux package maintenance TUI"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
fuzzy-matcher = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "underline-color"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
